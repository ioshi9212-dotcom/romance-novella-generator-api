name: Backend tests
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest "httpx>=0.27,<1"
      - name: Run regression tests
        run: python -m pytest -q -s
      - name: Stress-test 240 saved turns and sixteen audits
        env:
          NOVELLA_SIM_TURNS: "240"
        run: python -m pytest -q -s tests/test_scenario_simulation.py::test_120_turn_story_full_lifecycle_with_checks_and_churn
