name: Tests

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATA_DIR: /tmp/novella-data
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Active lore questionnaire test
        run: python -m pytest -q tests/test_active_lore_memory.py::test_turn_packet_keeps_questionnaire_pov_and_npc_memory_causally_active

      - name: Active lore pending recovery test
        run: python -m pytest -q tests/test_active_lore_memory.py::test_active_lore_service_preserves_pending_turn_recovery

      - name: Existing test suite
        run: python -m pytest -q --ignore=tests/test_active_lore_memory.py

      - name: Verify generated Actions schema
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.yaml
