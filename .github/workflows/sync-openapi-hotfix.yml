name: Sync OpenAPI Hotfix

on:
  push:
    branches:
      - fix/openapi-action-description-limits

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: /tmp/novella-data
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/openapi-action-description-limits
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Regenerate schema
        run: python scripts/export_openapi.py
      - name: Commit schema if changed
        run: |
          if git diff --quiet -- openapi.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi.yaml
          git commit -m "Regenerate OpenAPI schema"
          git push origin HEAD:fix/openapi-action-description-limits
