name: Apply v9.4 session chunks

on:
  push:
    branches:
      - agent/session-bootstrap-chunks-v94

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and apply verified patch
        run: |
          base64 --decode .github/session-chunks-v94.patch.gz.b64 | gzip --decompress > /tmp/session-chunks-v94.patch
          git apply --check /tmp/session-chunks-v94.patch
          git apply /tmp/session-chunks-v94.patch
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest==8.3.4 httpx==0.28.1

      - name: Run full test suite
        run: python -m pytest -q

      - name: Commit tested implementation
        run: |
          rm -f .github/session-chunks-v94.patch.gz.b64
          rm -f .github/workflows/apply-session-chunks-v94.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Chunk createSession bootstrap prompt responses"
          git push origin HEAD:agent/session-bootstrap-chunks-v94
