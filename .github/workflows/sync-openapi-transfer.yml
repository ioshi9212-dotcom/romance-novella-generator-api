name: Sync transfer OpenAPI

on:
  push:
    branches:
      - chunked-session-transfer

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chunked-session-transfer
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - run: python scripts/export_openapi.py
      - name: Commit generated schema if changed
        run: |
          if git diff --quiet -- openapi.yaml; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add openapi.yaml
          git commit -m "Sync OpenAPI for chunked session transfer"
          git push origin HEAD:chunked-session-transfer
