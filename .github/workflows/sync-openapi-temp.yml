name: Sync OpenAPI Temp

on:
  push:
    branches:
      - fix/foundation-memory-packet-efficiency

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/foundation-memory-packet-efficiency
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: |
          python -m pip install -r requirements-dev.txt
          python scripts/export_openapi.py
      - name: Commit generated schema if changed
        run: |
          if git diff --quiet -- openapi.yaml; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add openapi.yaml
          git commit -m 'Sync generated OpenAPI schema'
          git push origin HEAD:fix/foundation-memory-packet-efficiency
