openapi: 3.1.0
info:
  title: Interactive Novella State Runtime
  description: Session-scoped Railway storage for a Custom GPT visual novella. The API stores state and never calls
    an OpenAI model.
  version: 1.0.0
paths:
  /api/v1/sessions:
    post:
      summary: Create one new novella session after player confirmation
      description: Call only after the player explicitly confirms the setup preview. Returns a random session_id
        that is mandatory for every later action.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSessionResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/turn-packet:
    post:
      summary: Get the authoritative packet required to write one scene
      description: Reads the exact session state, rules, builder, chronology and current unaudited turns. If the
        15-turn audit is due, this action returns AUDIT_REQUIRED and no scene may be written.
      operationId: getTurnPacket
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TurnPacketRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacketChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/turn-packets/{packet_id}/chunks/{chunk_index}:
    get:
      summary: Read another ordered chunk of a turn packet
      operationId: getTurnPacketChunk
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: packet_id
        in: path
        required: true
        schema:
          type: string
          title: Packet Id
      - name: chunk_index
        in: path
        required: true
        schema:
          type: integer
          title: Chunk Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacketChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/turn-packets/{packet_id}/scene-characters/{character_id}/bundle:
    post:
      summary: Load one known offscreen character who will enter the pending scene
      description: Use only after every turn-packet chunk was read and the story now causes this already-known character
        to physically enter the scene. Returns only that character's complete card, current state, knowledge and
        directional relationships. Read every bundle chunk before commitTurn.
      operationId: getSceneCharacterBundle
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: packet_id
        in: path
        required: true
        schema:
          type: string
          title: Packet Id
      - name: character_id
        in: path
        required: true
        schema:
          type: string
          title: Character Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneCharacterBundleRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneCharacterBundleChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/turn-packets/{packet_id}/scene-character-bundles/{bundle_id}/chunks/{chunk_index}:
    get:
      summary: Read the next ordered chunk of one entering character's dossier
      description: Read in strict order until all_chunks_delivered is true. commitTurn remains blocked while any
        requested scene-character bundle is incomplete.
      operationId: getSceneCharacterBundleChunk
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: packet_id
        in: path
        required: true
        schema:
          type: string
          title: Packet Id
      - name: bundle_id
        in: path
        required: true
        schema:
          type: string
          title: Bundle Id
      - name: chunk_index
        in: path
        required: true
        schema:
          type: integer
          title: Chunk Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneCharacterBundleChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/turns/commit:
    post:
      summary: Atomically commit the generated scene and every state change
      description: Must succeed before the scene is shown to the player. The scene, chronology, state, character
        knowledge and relationships are stored in one session transaction.
      operationId: commitTurn
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitTurnRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitTurnResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/audit-packet:
    get:
      summary: Get the mandatory packet for the next 15-turn audit
      description: Returns all 15 complete current turn revisions, the full compact chronology and current state.
        The next scene remains blocked until commitAudit succeeds.
      operationId: getAuditPacket
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacketChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/audit-packets/{packet_id}/chunks/{chunk_index}:
    get:
      summary: Read another ordered chunk of an audit packet
      operationId: getAuditPacketChunk
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: packet_id
        in: path
        required: true
        schema:
          type: string
          title: Packet Id
      - name: chunk_index
        in: path
        required: true
        schema:
          type: integer
          title: Chunk Index
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PacketChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/audits/commit:
    post:
      summary: Commit a completed 15-turn audit and release the scene gate
      description: All checklist fields must be true. Repairs, compaction and chronology corrections are stored
        atomically before another turn packet is allowed.
      operationId: commitAudit
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitAuditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommitAuditResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
  /api/v1/sessions/{session_id}/chronology:
    get:
      summary: Read the session chronology in order
      operationId: getChronologyPage
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Cursor
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 100
          title: Limit
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          description: Include superseded and hidden source events for diagnostics only.
          default: false
          title: Include Inactive
        description: Include superseded and hidden source events for diagnostics only.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChronologyPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security: []
components:
  schemas:
    AuditChecklist:
      properties:
        events_and_consequences:
          type: boolean
          title: Events And Consequences
        time_and_movement:
          type: boolean
          title: Time And Movement
        scene_and_physical_state:
          type: boolean
          title: Scene And Physical State
        character_current_states:
          type: boolean
          title: Character Current States
        character_continuity:
          type: boolean
          title: Character Continuity
        minor_npc_lifecycle:
          type: boolean
          title: Minor Npc Lifecycle
        knowledge_sources:
          type: boolean
          title: Knowledge Sources
        knowledge_boundaries:
          type: boolean
          title: Knowledge Boundaries
        directional_relationships:
          type: boolean
          title: Directional Relationships
        plot_threads:
          type: boolean
          title: Plot Threads
        hidden_lore_and_reveal_timing:
          type: boolean
          title: Hidden Lore And Reveal Timing
        director_plan_and_offscreen_consequences:
          type: boolean
          title: Director Plan And Offscreen Consequences
        character_card_levels_and_promotions:
          type: boolean
          title: Character Card Levels And Promotions
        location_canon_and_current_changes:
          type: boolean
          title: Location Canon And Current Changes
        compaction_and_duplicates:
          type: boolean
          title: Compaction And Duplicates
      type: object
      required:
      - events_and_consequences
      - time_and_movement
      - scene_and_physical_state
      - character_current_states
      - character_continuity
      - minor_npc_lifecycle
      - knowledge_sources
      - knowledge_boundaries
      - directional_relationships
      - plot_threads
      - hidden_lore_and_reveal_timing
      - director_plan_and_offscreen_consequences
      - character_card_levels_and_promotions
      - location_canon_and_current_changes
      - compaction_and_duplicates
      title: AuditChecklist
    CharacterAppearance:
      properties:
        height:
          type: string
          maxLength: 200
          minLength: 1
          title: Height
        build:
          type: string
          maxLength: 300
          minLength: 1
          title: Build
        hair:
          type: string
          maxLength: 300
          minLength: 1
          title: Hair
        eyes:
          type: string
          maxLength: 300
          minLength: 1
          title: Eyes
        face:
          type: string
          maxLength: 500
          minLength: 1
          title: Face
        skin_and_features:
          type: string
          maxLength: 500
          minLength: 1
          title: Skin And Features
        movement_and_mannerisms:
          type: string
          maxLength: 700
          minLength: 1
          title: Movement And Mannerisms
        clothing_style:
          type: string
          maxLength: 700
          minLength: 1
          title: Clothing Style
        distinguishing_details:
          items:
            type: string
          type: array
          maxItems: 6
          minItems: 1
          title: Distinguishing Details
        visual_impression:
          type: string
          maxLength: 500
          minLength: 1
          title: Visual Impression
        visual_noticeability:
          type: string
          enum:
          - unremarkable
          - pleasant
          - attractive
          - striking
          - distinctive
          title: Visual Noticeability
      additionalProperties: true
      type: object
      required:
      - height
      - build
      - hair
      - eyes
      - face
      - skin_and_features
      - movement_and_mannerisms
      - clothing_style
      - distinguishing_details
      - visual_impression
      - visual_noticeability
      title: CharacterAppearance
    CharacterBundle:
      properties:
        character_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Character Id
        card:
          $ref: '#/components/schemas/CharacterCard'
          description: Relatively stable character card.
        current_state:
          type: object
          title: Current State
          description: Frequently changing location, condition, goal, intention and activity.
          properties: {}
        relationships:
          $ref: '#/components/schemas/RelationshipsDocument'
          description: Relationships owned by this character and directed toward targets.
        knowledge:
          type: object
          title: Knowledge
          description: Only facts, partial facts and wrong beliefs known by this character.
          properties: {}
      type: object
      required:
      - character_id
      - card
      title: CharacterBundle
    CharacterCard:
      properties:
        character_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Character Id
        card_level:
          type: string
          enum:
          - noticeable
          - recurring
          - important
          - player_defined
          title: Card Level
        origin:
          type: string
          enum:
          - player
          - director_setup
          - runtime
          title: Origin
        card_hint:
          type: string
          maxLength: 3000
          minLength: 1
          title: Card Hint
        record_status:
          type: string
          enum:
          - active
          - inactive
          title: Record Status
        story_status:
          type: string
          enum:
          - not_introduced
          - active
          - offstage
          - missing
          - dead
          - retired
          title: Story Status
        player_visibility:
          type: string
          enum:
          - hidden
          - partial
          - visible
          title: Player Visibility
        identity:
          $ref: '#/components/schemas/CharacterIdentity'
        appearance:
          $ref: '#/components/schemas/CharacterAppearance'
        immediate_scene_goal:
          type: string
          maxLength: 700
          minLength: 1
          title: Immediate Scene Goal
        personality:
          anyOf:
          - $ref: '#/components/schemas/CharacterPersonality'
          - type: 'null'
        preferences:
          anyOf:
          - $ref: '#/components/schemas/CharacterPreferences'
          - type: 'null'
        biography:
          items:
            type: string
          type: array
          maxItems: 12
          title: Biography
        skills:
          items:
            type: string
          type: array
          maxItems: 12
          title: Skills
        goals:
          anyOf:
          - $ref: '#/components/schemas/CharacterGoals'
          - type: 'null'
        hidden_motives:
          items:
            type: string
          type: array
          maxItems: 8
          title: Hidden Motives
        secrets:
          items:
            type: string
          type: array
          maxItems: 8
          title: Secrets
        constraints:
          items:
            type: string
          type: array
          maxItems: 8
          title: Constraints
      additionalProperties: true
      type: object
      required:
      - character_id
      - card_level
      - origin
      - card_hint
      - record_status
      - story_status
      - player_visibility
      - identity
      - appearance
      - immediate_scene_goal
      title: CharacterCard
    CharacterGoals:
      properties:
        personal:
          type: string
          maxLength: 1000
          minLength: 1
          title: Personal
        immediate:
          type: string
          maxLength: 700
          minLength: 1
          title: Immediate
        toward_pov:
          type: string
          maxLength: 700
          minLength: 1
          title: Toward Pov
        story_function:
          type: string
          maxLength: 1000
          minLength: 1
          title: Story Function
        possible_arc:
          type: string
          maxLength: 1000
          minLength: 1
          title: Possible Arc
      additionalProperties: true
      type: object
      required:
      - personal
      - immediate
      - toward_pov
      - story_function
      - possible_arc
      title: CharacterGoals
    CharacterIdentity:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        age:
          type: string
          maxLength: 100
          minLength: 1
          title: Age
        role:
          type: string
          maxLength: 500
          minLength: 1
          title: Role
        occupation:
          type: string
          maxLength: 500
          minLength: 1
          title: Occupation
      additionalProperties: true
      type: object
      required:
      - name
      - age
      - role
      - occupation
      title: CharacterIdentity
    CharacterPersonality:
      properties:
        outward_mask:
          type: string
          maxLength: 700
          minLength: 1
          title: Outward Mask
        inner_character:
          type: string
          maxLength: 1000
          minLength: 1
          title: Inner Character
        strengths:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Strengths
        flaws:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Flaws
        temperament:
          type: string
          maxLength: 400
          minLength: 1
          title: Temperament
        internal_conflict:
          type: string
          maxLength: 1000
          minLength: 1
          title: Internal Conflict
        behavior_under_pressure:
          type: string
          maxLength: 700
          minLength: 1
          title: Behavior Under Pressure
        habits:
          items:
            type: string
          type: array
          maxItems: 6
          minItems: 2
          title: Habits
        speech:
          type: string
          maxLength: 700
          minLength: 1
          title: Speech
      additionalProperties: true
      type: object
      required:
      - outward_mask
      - inner_character
      - strengths
      - flaws
      - temperament
      - internal_conflict
      - behavior_under_pressure
      - habits
      - speech
      title: CharacterPersonality
    CharacterPreferences:
      properties:
        likes:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Likes
        dislikes:
          items:
            type: string
          type: array
          maxItems: 8
          minItems: 1
          title: Dislikes
        likes_in_people:
          items:
            type: string
          type: array
          maxItems: 6
          minItems: 1
          title: Likes In People
        dislikes_in_people:
          items:
            type: string
          type: array
          maxItems: 6
          minItems: 1
          title: Dislikes In People
      additionalProperties: true
      type: object
      required:
      - likes
      - dislikes
      - likes_in_people
      - dislikes_in_people
      title: CharacterPreferences
    CharacterUpdate:
      properties:
        character_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Character Id
        card:
          anyOf:
          - $ref: '#/components/schemas/CharacterCard'
          - type: 'null'
        card_change_reason:
          anyOf:
          - type: string
            maxLength: 1000
            minLength: 1
          - type: 'null'
          title: Card Change Reason
        current_state:
          anyOf:
          - type: object
            properties: {}
          - type: 'null'
          title: Current State
        relationships:
          anyOf:
          - $ref: '#/components/schemas/RelationshipsDocument'
          - type: 'null'
        knowledge:
          anyOf:
          - type: object
            properties: {}
          - type: 'null'
          title: Knowledge
      type: object
      required:
      - character_id
      title: CharacterUpdate
    ChronologyCompactionInput:
      properties:
        scene_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Scene Id
        story_datetime:
          type: string
          title: Story Datetime
        location_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          - type: 'null'
          title: Location Id
        participants_present:
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          type: array
          title: Participants Present
        event:
          type: string
          maxLength: 3000
          minLength: 1
          title: Event
        consequences:
          items:
            type: string
          type: array
          title: Consequences
        knowledge_update_refs:
          items:
            type: string
          type: array
          title: Knowledge Update Refs
        minor_npcs:
          items:
            type: object
            properties: {}
          type: array
          title: Minor Npcs
        supersedes_event_id:
          type: 'null'
          title: Supersedes Event Id
        turn_number:
          type: integer
          minimum: 1.0
          title: Turn Number
        compacts_event_ids:
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          type: array
          minItems: 1
          title: Compacts Event Ids
          description: Existing active events replaced in runtime context by this compact summary.
      type: object
      required:
      - scene_id
      - story_datetime
      - event
      - turn_number
      - compacts_event_ids
      title: ChronologyCompactionInput
    ChronologyCorrectionInput:
      properties:
        scene_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Scene Id
        story_datetime:
          type: string
          title: Story Datetime
        location_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          - type: 'null'
          title: Location Id
        participants_present:
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          type: array
          title: Participants Present
        event:
          type: string
          maxLength: 3000
          minLength: 1
          title: Event
        consequences:
          items:
            type: string
          type: array
          title: Consequences
        knowledge_update_refs:
          items:
            type: string
          type: array
          title: Knowledge Update Refs
        minor_npcs:
          items:
            type: object
            properties: {}
          type: array
          title: Minor Npcs
        supersedes_event_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Supersedes Event Id
        turn_number:
          type: integer
          minimum: 1.0
          title: Turn Number
      type: object
      required:
      - scene_id
      - story_datetime
      - event
      - supersedes_event_id
      - turn_number
      title: ChronologyCorrectionInput
    ChronologyEventInput:
      properties:
        scene_id:
          type: string
          maxLength: 128
          minLength: 1
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          title: Scene Id
        story_datetime:
          type: string
          title: Story Datetime
        location_id:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          - type: 'null'
          title: Location Id
        participants_present:
          items:
            type: string
            maxLength: 128
            minLength: 1
            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
          type: array
          title: Participants Present
        event:
          type: string
          maxLength: 3000
          minLength: 1
          title: Event
        consequences:
          items:
            type: string
