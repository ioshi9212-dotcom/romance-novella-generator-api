            legacy Action schemas.
        player_confirmation:
          type: string
          maxLength: 500
          minLength: 1
          title: Player Confirmation
          description: Copy the player's actual message containing the positive word «подтверждаю».
        setup_source:
          anyOf:
          - $ref: '#/components/schemas/SetupSource'
          - type: 'null'
          description: Required by runtime contract 2.0. Preserve the player's exact setup wording and map every
            source message to the state sections where its facts were stored. Omission is accepted only for installed
            legacy schemas.
        novel:
          type: object
          title: Novel
          description: Complete confirmed settings. Contract 2.0 requires title, genre, tone, style, pov_character_id,
            narration, choices_enabled, scene_length_chars {min,max,scope}, player_constraints and content_constraints.
          properties: {}
        hidden_lore:
          type: object
          title: Hidden Lore
          description: Director-only state with explicit facts, secrets, reveal_conditions, false_versions_in_world
            and protected_until arrays; never player preview text.
          properties: {}
        plot_state:
          type: object
          title: Plot State
          description: Requires active_lines, open_threads, pending_consequences, foreshadowing, resolved_history
            and next_pressure_points arrays. At least one live direction must be concrete.
          properties: {}
        director_plan:
          $ref: '#/components/schemas/DirectorPlan'
          description: 'Flexible director-only plan: independent character agendas, event windows, collisions and
            consequences that can happen without POV. Optional only for compatibility with previously imported GPT
            Action schemas.'
        world_state:
          type: object
          title: World State
          description: Requires story_datetime plus explicit global_situation, character_whereabouts, offscreen_actions,
            active_dangers and location_availability arrays.
          properties: {}
        scene_state:
          type: object
          title: Scene State
          description: Exact current frame. Contract 2.0 requires turn_number=0, scene_id, story_datetime, location_id,
            zone, present/entered/left character arrays, positions, objects, clothing, lighting, weather, doors/windows,
            sounds, unfinished actions and continue_from.
          properties: {}
        characters:
          items:
            $ref: '#/components/schemas/CharacterBundle'
          type: array
          minItems: 1
          title: Characters
          description: Every confirmed card character, including POV and hidden future characters.
        locations:
          items:
            $ref: '#/components/schemas/LocationBundle'
          type: array
          title: Locations
        objects:
          items:
            $ref: '#/components/schemas/ObjectBundle'
          type: array
          title: Objects
      type: object
      required:
      - player_confirmation
      - novel
      - hidden_lore
      - plot_state
      - world_state
      - scene_state
      - characters
      - runtime_contract_version
      - setup_source
      - director_plan
